<figure class="video">
  <iframe src="https://www.youtube.com/embed/{{ include.id | escape }}" title="{{ include.title | escape }}" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  {% assign video_caption = include.caption | default: include.title %}
  {% include caption.html text=video_caption %}
</figure>
