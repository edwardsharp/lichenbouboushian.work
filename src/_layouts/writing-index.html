---
layout: default
---
<article class="shell page">
  <header class="page-heading">
    <h1 class="display-title">{{ page.title | escape }}</h1>
  </header>
  <div class="prose">
    {{ content }}
    {% assign writing = site.documents | where: 'layout', 'writing' | sort: 'title' %}
    {% if writing.size > 0 %}
      <ul>
        {% for entry in writing %}
          <li><a href="{{ entry.url | relative_url }}">{{ entry.title | escape }}</a></li>
        {% endfor %}
      </ul>
    {% endif %}
  </div>
</article>
