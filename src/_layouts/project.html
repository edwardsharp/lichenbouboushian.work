---
layout: default
---

<article class="shell page project-page">
  <header class="page-heading">
    <h1 class="display-title">{{ page.title | escape }}</h1>
  </header>
  {% include project-body.html item=page content=content %}
  {% assign projects_index = site.documents | where: 'layout', 'projects' | first %}
  <div class="project-back">
    <a class="text-link" href="{{ '/projects/' | relative_url }}"
      ><span aria-hidden="true">←</span> Back to {{ projects_index.title | default: 'projects' | downcase | escape }}</a
    >
  </div>
</article>
