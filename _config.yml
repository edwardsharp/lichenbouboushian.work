title: Judy
description: A sample artist website featuring Judy.
email: ""
lang: en
locale: en_US
url: ""
baseurl: ""
social_image: /content/images/judy-03.webp
social_image_alt: Judy sitting beside a lamp.

collections_dir: content
collections:
  pages:
    output: true
    permalink: /:path/

layouts_dir: src/_layouts
includes_dir: src/_includes
plugins_dir: src/_plugins
sass:
  sass_dir: src/_sass
  style: compressed
  sourcemap: never

defaults:
  - scope:
      path: "content/_pages"
      type: pages
    values:
      layout: page
  - scope:
      path: "content/_pages/writing"
      type: pages
    values:
      layout: writing
      columns: true

markdown: kramdown
kramdown:
  input: GFM
strict_front_matter: true
liquid:
  error_mode: strict

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .github
